tasks:
  # Derives every kind of output from the input, so that the outputs on disk
  # can be compared against what the input should produce. Inputs that start
  # with `o` also create the optional output, and those that start with `fail`
  # create outputs, but then fail.
  derive:
    script: >-
      rm -rf out && mkdir -p out/glob &&
      v="$(cat input.txt)" &&
      printf '%s' "$v" > out/required.txt &&
      printf '%s' "$v" > "out/glob/$v.txt" &&
      case "$v" in o*) printf '%s' "$v" > out/optional.txt ;; esac &&
      case "$v" in fail*) exit 1 ;; esac
    inputs:
      - 'input.txt'
    outputs:
      - 'out/required.txt'
      - file: 'out/optional.txt'
        optional: true
      - 'out/glob/*.txt'
    toolchain: system
